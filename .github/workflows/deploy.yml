name: Deploy ReMediaLHQ

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remedialhq-production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: remedialhq
  IMAGE: engine
  GRYPE_VERSION: 0.114.0
  GRYPE_ARCHIVE_SHA256: edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343
  DEPLOY_SERVICES: >-
    remedialhq-prod-measure remedialhq-prod-publish remedialhq-prod-gate
    remedialhq-prod-compile remedialhq-prod-reconcile remedialhq-prod-collect
    remedialhq-prod-site

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: pip install --require-hashes --requirement requirements-build.lock
      - run: pip install --require-hashes --requirement requirements-production.lock
      - run: pip install --require-hashes --requirement requirements-dev.lock
      - run: pip install --no-build-isolation --no-deps --editable .
      - run: ruff check src scripts tests
      - run: mypy src/remedialhq scripts
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: remedialhq demo --root . --output /tmp/remedialhq-demo
      - run: remedialhq verify-ledger /tmp/remedialhq-demo/ledger.jsonl
      - run: node --check site/app.js
      - name: Check administrative release evidence when present
        run: |
          if [[ -f scripts/check_release_evidence.py ]]; then
            python scripts/check_release_evidence.py
          elif [[ -f PACKAGE_CONTENTS.json && -f PACKAGE_SHA256SUMS.txt ]]; then
            package_dir="$(mktemp -d)"
            git archive --format=tar HEAD | tar -xf - -C "$package_dir"
            (cd "$package_dir" && python scripts/verify_manifest.py)
            rm -rf "$package_dir"
          else
            echo "Release evidence checker or verified public-package markers are required." >&2
            exit 1
          fi
      - run: >-
          python scripts/build_public_release.py
          --output /tmp/remedialhq-public-release.zip
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.7.5
      - name: Validate Terraform without production state
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check
          terraform validate

  build-and-deploy:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate the immutable registry target
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?GCP_PROJECT_ID repository variable is required}"
          : "${REGION:?GCP_REGION repository variable is required}"
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: '569.0.0'
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - id: push
        name: Build and push the attested immutable candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "{{defaultContext}}"
          platforms: linux/amd64
          provenance: mode=max
          pull: true
          push: true
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
      - id: image
        name: Verify the pushed digest and BuildKit attestations
        env:
          BUILD_METADATA: ${{ steps.push.outputs.metadata }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?GCP_PROJECT_ID repository variable is required}"
          : "${REGION:?GCP_REGION repository variable is required}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}@${DIGEST}"
          REMOTE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_URI" --format='value(image_summary.digest)')"
          [[ "$REMOTE_DIGEST" == "$DIGEST" ]]

          printf '%s\n' "$BUILD_METADATA" > buildkit-metadata.json
          docker buildx imagetools inspect "$IMAGE_URI" --raw > oci-index.json
          python - "$DIGEST" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" <<'PY'
          import json
          import pathlib
          import re
          import sys

          expected_digest, expected_commit, expected_repository, server_url = sys.argv[1:]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None:
              raise SystemExit("BuildKit returned an invalid image digest")
          if re.fullmatch(r"[0-9a-f]{40}", expected_commit) is None:
              raise SystemExit("GitHub supplied an invalid source commit")
          if re.fullmatch(r"[^/\s]+/[^/\s]+", expected_repository) is None:
              raise SystemExit("GitHub supplied an invalid repository identity")
          for name in ("buildkit-metadata.json", "oci-index.json"):
              try:
                  value = json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"{name} is unreadable or invalid: {exc}") from exc
              if not isinstance(value, dict):
                  raise SystemExit(f"{name} is not a JSON object")

          metadata = json.loads(pathlib.Path("buildkit-metadata.json").read_text(encoding="utf-8"))
          if metadata.get("containerimage.digest") != expected_digest:
              raise SystemExit("BuildKit metadata is not bound to the pushed digest")
          provenance = metadata.get("buildx.build.provenance")
          if not isinstance(provenance, dict) or not provenance.get("buildType"):
              raise SystemExit("BuildKit metadata is missing its provenance statement")
          materials = provenance.get("materials")
          if not isinstance(materials, list) or not materials:
              raise SystemExit("BuildKit provenance is missing source materials")
          expected_source = f"{server_url.rstrip('/')}/{expected_repository}".casefold()
          source_bound = False
          for material in materials:
              if not isinstance(material, dict):
                  raise SystemExit("BuildKit provenance contains a malformed material")
              uri = str(material.get("uri", "")).casefold()
              source_uri = uri.split("#", 1)[0].removesuffix(".git").rstrip("/")
              digests = material.get("digest")
              if not isinstance(digests, dict):
                  continue
              digest_values = {str(value).casefold() for value in digests.values()}
              if source_uri == expected_source and expected_commit in digest_values:
                  source_bound = True
          if not source_bound:
              raise SystemExit(
                  "BuildKit provenance is not bound to the expected GitHub repository and commit"
              )

          index = json.loads(pathlib.Path("oci-index.json").read_text(encoding="utf-8"))
          manifests = index.get("manifests")
          if not isinstance(manifests, list) or not manifests:
              raise SystemExit("pushed image is missing its OCI manifest list")
          attestations = [
              item
              for item in manifests
              if isinstance(item, dict)
              and isinstance(item.get("annotations"), dict)
              and item["annotations"].get("vnd.docker.reference.type")
              == "attestation-manifest"
          ]
          application_manifests = [
              item
              for item in manifests
              if isinstance(item, dict)
              and item.get("mediaType") == "application/vnd.oci.image.manifest.v1+json"
              and item.get("platform") == {"architecture": "amd64", "os": "linux"}
              and not (
                  isinstance(item.get("annotations"), dict)
                  and item["annotations"].get("vnd.docker.reference.type")
                  == "attestation-manifest"
              )
          ]
          if len(application_manifests) != 1:
              raise SystemExit("pushed image must contain exactly one linux/amd64 manifest")
          if len(attestations) != 1:
              raise SystemExit("pushed image must contain exactly one BuildKit attestation manifest")
          application_digest = application_manifests[0].get("digest")
          if not isinstance(application_digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}", application_digest
          ) is None:
              raise SystemExit("application manifest has an invalid digest")
          attestation_reference = attestations[0]["annotations"].get(
              "vnd.docker.reference.digest"
          )
          if attestation_reference != application_digest:
              raise SystemExit("BuildKit attestation manifest is not attached to the application")
          attestation_digest = attestations[0].get("digest")
          if not isinstance(attestation_digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}", attestation_digest
          ) is None:
              raise SystemExit("BuildKit attestation manifest has an invalid digest")
          pathlib.Path("buildkit-attestation-digest.txt").write_text(
              f"{attestation_digest}\n", encoding="utf-8"
          )
          PY
          IFS= read -r ATTESTATION_DIGEST < buildkit-attestation-digest.txt
          IMAGE_NAME="${IMAGE_URI%@*}"
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${ATTESTATION_DIGEST}" \
            --raw > buildkit-attestation-manifest.json
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("buildkit-attestation-manifest.json")
          try:
              manifest = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"BuildKit attestation manifest is invalid: {exc}") from exc
          layers = manifest.get("layers")
          if not isinstance(layers, list) or not layers:
              raise SystemExit("BuildKit attestation manifest has no statement layers")
          predicate_types = {
              layer.get("annotations", {}).get("in-toto.io/predicate-type")
              for layer in layers
              if isinstance(layer, dict) and isinstance(layer.get("annotations"), dict)
          }
          required = {
              "https://spdx.dev/Document",
              "https://slsa.dev/provenance/v0.2",
          }
          missing = sorted(required - predicate_types)
          if missing:
              raise SystemExit(f"BuildKit attestations are missing predicates: {missing}")
          PY
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
      - name: Probe the exact pushed digest as the non-root runtime
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -Eeuo pipefail
          : "${IMAGE_URI:?Immutable image output is required}"
          site_container="remedialhq-site-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          service_container="remedialhq-service-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          health_dir="$(mktemp -d)"
          cleanup() {
            docker rm --force "$site_container" "$service_container" >/dev/null 2>&1 || true
            rm -rf "$health_dir"
          }
          trap cleanup EXIT

          docker pull "$IMAGE_URI"
          runtime_identity="$(docker run --rm --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --entrypoint python "$IMAGE_URI" \
            -c 'import os; print(f"{os.getuid()}:{os.getgid()}")')"
          [[ "$runtime_identity" == "65532:65532" ]]
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            "$IMAGE_URI" --help >/dev/null

          docker run --detach --name "$site_container" \
            --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --entrypoint python \
            --publish 127.0.0.1:18080:8080 \
            "$IMAGE_URI" \
            -m http.server 8080 --bind 0.0.0.0 --directory /app/site >/dev/null
          docker run --detach --name "$service_container" \
            --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --env APP_ROOT=/app \
            --env PHASE=collect \
            --env WORKSPACE=/tmp/remedialhq \
            --entrypoint python \
            --publish 127.0.0.1:18081:8080 \
            "$IMAGE_URI" -m remedialhq.service >/dev/null

          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/index.html" http://127.0.0.1:18080/
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/claims.json" http://127.0.0.1:18080/data/claims.json
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/sources.json" http://127.0.0.1:18080/data/sources.json
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/service-health.json" http://127.0.0.1:18081/healthz
          python - "$health_dir" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          health_root = pathlib.Path(sys.argv[1])
          if b"ReMediaLHQ" not in (health_root / "index.html").read_bytes():
              raise SystemExit("candidate site response is missing the ReMediaLHQ identity")

          claims = json.loads((health_root / "claims.json").read_text(encoding="utf-8"))
          sources = json.loads((health_root / "sources.json").read_text(encoding="utf-8"))
          service_health = json.loads(
              (health_root / "service-health.json").read_text(encoding="utf-8")
          )
          if service_health != {
              "phase": "collect",
              "state_backend": "sqlite",
              "status": "ok",
          }:
              raise SystemExit(f"unexpected phase-service health response: {service_health!r}")
          if not isinstance(claims, list) or not claims:
              raise SystemExit("candidate claim data is empty or invalid")
          if not isinstance(sources, list) or not sources:
              raise SystemExit("candidate source data is empty or invalid")
          source_ids = {item.get("source_id") for item in sources if isinstance(item, dict)}
          missing = sorted(
              {
                  source_id
                  for claim in claims
                  if isinstance(claim, dict)
                  for source_id in claim.get("source_ids", [])
                  if source_id not in source_ids
              }
          )
          if missing:
              raise SystemExit(f"candidate claims reference missing sources: {missing}")

          for name in ("claims.json", "sources.json"):
              actual = hashlib.sha256((health_root / name).read_bytes()).hexdigest()
              expected = hashlib.sha256(pathlib.Path("site/data", name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"candidate {name} does not match the release source")
          PY
      - id: trivy-scan
        name: Scan the immutable pushed image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          exit-code: '0'
          format: json
          hide-progress: true
          ignore-unfixed: false
          image-ref: ${{ steps.image.outputs.image_uri }}
          output: trivy-deploy-report.json
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Install checksum-pinned Grype
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --retry 5 --retry-all-errors \
            --show-error --silent \
            --output "$archive" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GRYPE_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" grype
          chmod 0755 "${RUNNER_TEMP}/grype"
          echo "GRYPE_BIN=${RUNNER_TEMP}/grype" >> "$GITHUB_ENV"
      - id: grype-scan
        name: Scan the immutable pushed image with Grype
        continue-on-error: true
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: >-
          "$GRYPE_BIN" "$IMAGE_URI" --quiet --output json
          --file grype-deploy-report.json
      - name: Enforce the dual-scanner Critical and High gate
        if: ${{ always() }}
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy-scan.outcome }}
          GRYPE_SCAN_OUTCOME: ${{ steps.grype-scan.outcome }}
        run: |
          set -euo pipefail
          trivy_gate=0
          grype_gate=0
          python scripts/check_container_scan.py \
            trivy-deploy-report.json \
            --scanner trivy \
            --expected-image "$IMAGE_URI" \
            --output trivy-deploy-summary.json || trivy_gate=$?
          python scripts/check_container_scan.py \
            grype-deploy-report.json \
            --scanner grype \
            --expected-image "$IMAGE_URI" \
            --output grype-deploy-summary.json || grype_gate=$?
          if [[ "$TRIVY_SCAN_OUTCOME" != "success" || "$GRYPE_SCAN_OUTCOME" != "success" ]]; then
            echo "One or more container scanners did not complete successfully." >&2
            exit 1
          fi
          if (( trivy_gate != 0 || grype_gate != 0 )); then
            echo "The dual-scanner vulnerability gate rejected the immutable image." >&2
            exit 1
          fi
      - name: Upload the deployment vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-vulnerability-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            grype-deploy-report.json
            grype-deploy-summary.json
            trivy-deploy-report.json
            trivy-deploy-summary.json
          if-no-files-found: error
          retention-days: 90
      - name: Require completed Google Artifact Analysis with no blocking findings
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          python scripts/check_google_artifact_analysis.py \
            "$IMAGE_URI" \
            --output-dir . \
            --timeout-seconds 1200 \
            --poll-interval-seconds 15
      - name: Upload Google Artifact Analysis evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-analysis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifact-analysis-discovery.json
            artifact-analysis-sbom-export.json
            artifact-analysis-sbom.spdx.json
            artifact-analysis-summary.json
            artifact-analysis-vulnerabilities.json
          if-no-files-found: error
          retention-days: 90
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless sign and verify the immutable image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          : "${IMAGE_URI:?Immutable image output is required}"
          CERTIFICATE_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          cosign sign --yes "$IMAGE_URI"
          cosign verify \
            --certificate-identity="$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output=json \
            "$IMAGE_URI" > cosign-verification.json
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("cosign-verification.json")
          try:
              verification = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Cosign verification evidence is invalid: {exc}") from exc
          if not isinstance(verification, list) or not verification:
              raise SystemExit("Cosign verification returned no verified signatures")
          PY
      - name: Upload signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-supply-chain-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            buildkit-attestation-digest.txt
            buildkit-attestation-manifest.json
            buildkit-metadata.json
            cosign-verification.json
            oci-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Update existing Cloud Run services only
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -Eeuo pipefail
          : "${PROJECT_ID:?GCP_PROJECT_ID repository variable is required}"
          : "${REGION:?GCP_REGION repository variable is required}"
          : "${IMAGE_URI:?Immutable image output is required}"
          read -r -a services <<< "$DEPLOY_SERVICES"
          [[ "${#services[@]}" -eq 7 ]]
          prior_dir="$(mktemp -d)"
          attempted_services=()
          cleanup_prior_state() {
            rm -rf "$prior_dir"
          }
          trap cleanup_prior_state EXIT

          for service in "${services[@]}"; do
            gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format=export > "${prior_dir}/${service}.yaml"
            prior_status="$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format=json)"
            if [[ "$service" != "remedialhq-prod-site" ]]; then
              PRIOR_STATUS="$prior_status" python - "$service" <<'PY'
          import json
          import os
          import sys

          service = sys.argv[1]
          document = json.loads(os.environ["PRIOR_STATUS"])
          containers = (
              document.get("spec", {})
              .get("template", {})
              .get("spec", {})
              .get("containers", [])
          )
          if len(containers) != 1 or not isinstance(containers[0], dict):
              raise SystemExit(f"{service} does not have exactly one runtime container")
          values = {
              item.get("name"): str(item.get("value", "")).casefold()
              for item in containers[0].get("env", [])
              if isinstance(item, dict)
          }
          required_closed = {
              "ENABLE_NETWORK_COLLECTION",
              "PUBLISHING_ENABLED",
              "YOUTUBE_CREDENTIALS_READY",
              "YOUTUBE_LIVE_ADAPTER_ENABLED",
              "YOUTUBE_VISIBLE_PUBLICATION_AUTHORIZED",
          }
          unsafe = sorted(name for name in required_closed if values.get(name) != "false")
          if unsafe:
              raise SystemExit(f"{service} is not fail-closed before rollout: {unsafe}")
          PY
            fi
          done

          rollback_deployment() {
            status=$?
            trap - ERR
            set +e
            rollback_failed=0
            for ((index=${#attempted_services[@]} - 1; index >= 0; index--)); do
              service="${attempted_services[$index]}"
              if ! gcloud run services replace "${prior_dir}/${service}.yaml" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --quiet; then
                echo "::error title=Rollback failed::Could not restore the prior Cloud Run configuration and traffic for ${service}" >&2
                rollback_failed=1
              fi
            done
            if ((rollback_failed != 0)); then
              echo "::error title=Deployment and rollback failed::Manual recovery is required" >&2
              exit 70
            fi
            exit "$status"
          }
          trap rollback_deployment ERR

          for service in "${services[@]}"; do
            attempted_services+=("$service")
            if [[ "$service" == "remedialhq-prod-site" ]]; then
              gcloud run services update "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --image="$IMAGE_URI" \
                --quiet
            else
              gcloud run services update "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --image="$IMAGE_URI" \
                --update-env-vars="PUBLISHING_ENABLED=false,ENABLE_NETWORK_COLLECTION=false,YOUTUBE_LIVE_ADAPTER_ENABLED=false,YOUTUBE_CREDENTIALS_READY=false,YOUTUBE_VISIBLE_PUBLICATION_AUTHORIZED=false" \
                --quiet
            fi
            deployed_image="$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(spec.template.spec.containers[0].image)')"
            [[ "$deployed_image" == "$IMAGE_URI" ]]
          done

          for service in "${services[@]}"; do
            service_status="$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format=json)"
            SERVICE_STATUS="$service_status" python - "$service" "$IMAGE_URI" <<'PY'
          import json
          import os
          import sys

          service, expected_image = sys.argv[1:]
          document = json.loads(os.environ["SERVICE_STATUS"])
          conditions = {
              item.get("type"): item.get("status")
              for item in document.get("status", {}).get("conditions", [])
          }
          status = document.get("status", {})
          containers = document.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          actual_image = containers[0].get("image") if containers else None
          if conditions.get("Ready") != "True":
              raise SystemExit(f"{service} is not Ready")
          if status.get("latestReadyRevisionName") != status.get("latestCreatedRevisionName"):
              raise SystemExit(f"{service} latest revision is not ready")
          if actual_image != expected_image:
              raise SystemExit(f"{service} is not running the expected immutable image")
          PY
          done

          trap - ERR
