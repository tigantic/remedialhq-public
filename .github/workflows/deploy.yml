name: Deploy ReMediaLHQ

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remedialhq-production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: remedialhq
  IMAGE: engine
  DEPLOY_SERVICES: >-
    remedialhq-prod-collect remedialhq-prod-reconcile remedialhq-prod-compile
    remedialhq-prod-gate remedialhq-prod-publish remedialhq-prod-measure
    remedialhq-prod-site

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes --requirement requirements-build.lock
      - run: pip install --require-hashes --requirement requirements-production.lock
      - run: pip install --require-hashes --requirement requirements-dev.lock
      - run: pip install --no-build-isolation --no-deps --editable .
      - run: ruff check src scripts tests
      - run: mypy src/remedialhq scripts
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: remedialhq demo --root . --output /tmp/remedialhq-demo
      - run: remedialhq verify-ledger /tmp/remedialhq-demo/ledger.jsonl
      - run: node --check site/app.js
      - name: Check administrative release evidence when present
        run: |
          if [[ -f scripts/check_release_evidence.py ]]; then
            python scripts/check_release_evidence.py
          elif [[ -f PACKAGE_CONTENTS.json && -f PACKAGE_SHA256SUMS.txt ]]; then
            package_dir="$(mktemp -d)"
            git archive --format=tar HEAD | tar -xf - -C "$package_dir"
            (cd "$package_dir" && python scripts/verify_manifest.py)
            rm -rf "$package_dir"
          else
            echo "Release evidence checker or verified public-package markers are required." >&2
            exit 1
          fi
      - run: >-
          python scripts/build_public_release.py
          --output /tmp/remedialhq-public-release.zip
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.7.5
      - name: Validate Terraform without production state
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check
          terraform validate

  build-and-deploy:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build candidate before cloud authentication
        run: |
          set -euo pipefail
          image="remedialhq-candidate:${GITHUB_SHA}"
          container="remedialhq-site-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          health_dir="$(mktemp -d)"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$health_dir"
          }
          trap cleanup EXIT

          docker build --pull --tag "$image" .
          docker run --detach --name "$container" \
            --entrypoint python \
            --publish 127.0.0.1:18080:8080 \
            "$image" \
            -m http.server 8080 --bind 0.0.0.0 --directory /app/site
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/index.html" http://127.0.0.1:18080/
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/claims.json" http://127.0.0.1:18080/data/claims.json
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --output "$health_dir/sources.json" http://127.0.0.1:18080/data/sources.json
          python - "$health_dir" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          health_root = pathlib.Path(sys.argv[1])
          if b"ReMediaLHQ" not in (health_root / "index.html").read_bytes():
              raise SystemExit("candidate site response is missing the ReMediaLHQ identity")

          claims = json.loads((health_root / "claims.json").read_text(encoding="utf-8"))
          sources = json.loads((health_root / "sources.json").read_text(encoding="utf-8"))
          if not isinstance(claims, list) or not claims:
              raise SystemExit("candidate claim data is empty or invalid")
          if not isinstance(sources, list) or not sources:
              raise SystemExit("candidate source data is empty or invalid")
          source_ids = {item.get("source_id") for item in sources if isinstance(item, dict)}
          missing = sorted(
              {
                  source_id
                  for claim in claims
                  if isinstance(claim, dict)
                  for source_id in claim.get("source_ids", [])
                  if source_id not in source_ids
              }
          )
          if missing:
              raise SystemExit(f"candidate claims reference missing sources: {missing}")

          for name in ("claims.json", "sources.json"):
              actual = hashlib.sha256((health_root / name).read_bytes()).hexdigest()
              expected = hashlib.sha256(pathlib.Path("site/data", name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"candidate {name} does not match the release source")
          PY
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - id: image
        name: Build and push immutable candidate
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?GCP_PROJECT_ID repository variable is required}"
          : "${REGION:?GCP_REGION repository variable is required}"
          URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          docker tag "remedialhq-candidate:${GITHUB_SHA}" "$URI"
          docker push "$URI"
          DIGEST="$(gcloud artifacts docker images describe "$URI" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}@${DIGEST}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
      - name: Update existing Cloud Run services only
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -Eeuo pipefail
          : "${PROJECT_ID:?GCP_PROJECT_ID repository variable is required}"
          : "${REGION:?GCP_REGION repository variable is required}"
          : "${IMAGE_URI:?Immutable image output is required}"
          read -r -a services <<< "$DEPLOY_SERVICES"
          [[ "${#services[@]}" -eq 7 ]]
          declare -A prior_images
          updated_services=()

          for service in "${services[@]}"; do
            prior_image="$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(spec.template.spec.containers[0].image)')"
            [[ -n "$prior_image" ]]
            prior_images["$service"]="$prior_image"
          done

          rollback_deployment() {
            status=$?
            trap - ERR
            set +e
            rollback_failed=0
            for ((index=${#updated_services[@]} - 1; index >= 0; index--)); do
              service="${updated_services[$index]}"
              if ! gcloud run services update "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --image="${prior_images[$service]}" \
                --quiet; then
                echo "::error title=Rollback failed::Could not restore Cloud Run service ${service}" >&2
                rollback_failed=1
              fi
            done
            if ((rollback_failed != 0)); then
              echo "::error title=Deployment and rollback failed::Manual recovery is required" >&2
              exit 70
            fi
            exit "$status"
          }
          trap rollback_deployment ERR

          for service in "${services[@]}"; do
            if [[ "$service" == "remedialhq-prod-site" ]]; then
              gcloud run services update "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --image="$IMAGE_URI" \
                --quiet
            else
              gcloud run services update "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --image="$IMAGE_URI" \
                --update-env-vars="PUBLISHING_ENABLED=false,ENABLE_NETWORK_COLLECTION=false,YOUTUBE_LIVE_ADAPTER_ENABLED=false,YOUTUBE_CREDENTIALS_READY=false,YOUTUBE_VISIBLE_PUBLICATION_AUTHORIZED=false" \
                --quiet
            fi
            updated_services+=("$service")
            deployed_image="$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(spec.template.spec.containers[0].image)')"
            [[ "$deployed_image" == "$IMAGE_URI" ]]
          done

          for service in "${services[@]}"; do
            service_status="$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format=json)"
            SERVICE_STATUS="$service_status" python - "$service" "$IMAGE_URI" <<'PY'
          import json
          import os
          import sys

          service, expected_image = sys.argv[1:]
          document = json.loads(os.environ["SERVICE_STATUS"])
          conditions = {
              item.get("type"): item.get("status")
              for item in document.get("status", {}).get("conditions", [])
          }
          status = document.get("status", {})
          containers = document.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          actual_image = containers[0].get("image") if containers else None
          if conditions.get("Ready") != "True":
              raise SystemExit(f"{service} is not Ready")
          if status.get("latestReadyRevisionName") != status.get("latestCreatedRevisionName"):
              raise SystemExit(f"{service} latest revision is not ready")
          if actual_image != expected_image:
              raise SystemExit(f"{service} is not running the expected immutable image")
          PY
          done

          trap - ERR
