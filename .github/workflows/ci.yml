name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes --requirement requirements-build.lock
      - run: pip install --require-hashes --requirement requirements-production.lock
      - run: pip install --require-hashes --requirement requirements-dev.lock
      - run: pip install --no-build-isolation --no-deps --editable .
      - run: ruff check src scripts tests
      - run: mypy src/remedialhq scripts
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: remedialhq demo --root . --output /tmp/remedialhq-demo
      - run: remedialhq verify-ledger /tmp/remedialhq-demo/ledger.jsonl
      - run: node --check site/app.js
      - name: Check administrative release evidence when present
        run: |
          if [[ -f scripts/check_release_evidence.py ]]; then
            python scripts/check_release_evidence.py
          elif [[ -f PACKAGE_CONTENTS.json && -f PACKAGE_SHA256SUMS.txt ]]; then
            package_dir="$(mktemp -d)"
            git archive --format=tar HEAD | tar -xf - -C "$package_dir"
            (cd "$package_dir" && python scripts/verify_manifest.py)
            rm -rf "$package_dir"
          else
            echo "Release evidence checker or verified public-package markers are required." >&2
            exit 1
          fi
      - run: >-
          python scripts/build_public_release.py
          --output /tmp/remedialhq-public-release.zip
