name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

env:
  CI_IMAGE: remedialhq-ci:${{ github.sha }}
  GRYPE_VERSION: 0.114.0
  GRYPE_ARCHIVE_SHA256: edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: pip install --require-hashes --requirement requirements-build.lock
      - run: pip install --require-hashes --requirement requirements-production.lock
      - run: pip install --require-hashes --requirement requirements-dev.lock
      - run: pip install --no-build-isolation --no-deps --editable .
      - run: ruff check src scripts tests
      - run: mypy src/remedialhq scripts
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: remedialhq demo --root . --output /tmp/remedialhq-demo
      - run: remedialhq verify-ledger /tmp/remedialhq-demo/ledger.jsonl
      - run: node --check site/app.js
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the container candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: ${{ env.CI_IMAGE }}
      - name: Smoke-test the non-root CLI and phase service
        run: |
          set -Eeuo pipefail
          container="remedialhq-ci-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          runtime_identity="$(docker run --rm --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --entrypoint python "$CI_IMAGE" \
            -c 'import os; print(f"{os.getuid()}:{os.getgid()}")')"
          [[ "$runtime_identity" == "65532:65532" ]]
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            "$CI_IMAGE" --help >/dev/null

          docker run --detach --name "$container" \
            --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --env APP_ROOT=/app \
            --env PHASE=collect \
            --env WORKSPACE=/tmp/remedialhq \
            --entrypoint python \
            --publish 127.0.0.1:18081:8080 \
            "$CI_IMAGE" -m remedialhq.service >/dev/null
          service_health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            http://127.0.0.1:18081/healthz)"
          SERVICE_HEALTH="$service_health" python - <<'PY'
          import json
          import os

          health = json.loads(os.environ["SERVICE_HEALTH"])
          if health != {"phase": "collect", "state_backend": "sqlite", "status": "ok"}:
              raise SystemExit(f"unexpected phase-service health response: {health!r}")
          PY
      - id: trivy-scan
        name: Scan the container candidate with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          exit-code: '0'
          format: json
          hide-progress: true
          ignore-unfixed: false
          image-ref: ${{ env.CI_IMAGE }}
          output: trivy-ci-report.json
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Install checksum-pinned Grype
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --retry 5 --retry-all-errors \
            --show-error --silent \
            --output "$archive" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GRYPE_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" grype
          chmod 0755 "${RUNNER_TEMP}/grype"
          echo "GRYPE_BIN=${RUNNER_TEMP}/grype" >> "$GITHUB_ENV"
      - id: grype-scan
        name: Scan the container candidate with Grype
        continue-on-error: true
        run: >-
          "$GRYPE_BIN" "$CI_IMAGE" --quiet --output json
          --file grype-ci-report.json
      - name: Enforce the dual-scanner Critical and High gate
        if: ${{ always() }}
        env:
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy-scan.outcome }}
          GRYPE_SCAN_OUTCOME: ${{ steps.grype-scan.outcome }}
        run: |
          set -euo pipefail
          trivy_gate=0
          grype_gate=0
          python scripts/check_container_scan.py \
            trivy-ci-report.json \
            --scanner trivy \
            --expected-image "$CI_IMAGE" \
            --output trivy-ci-summary.json || trivy_gate=$?
          python scripts/check_container_scan.py \
            grype-ci-report.json \
            --scanner grype \
            --expected-image "$CI_IMAGE" \
            --output grype-ci-summary.json || grype_gate=$?
          if [[ "$TRIVY_SCAN_OUTCOME" != "success" || "$GRYPE_SCAN_OUTCOME" != "success" ]]; then
            echo "One or more container scanners did not complete successfully." >&2
            exit 1
          fi
          if (( trivy_gate != 0 || grype_gate != 0 )); then
            echo "The dual-scanner vulnerability gate rejected the candidate." >&2
            exit 1
          fi
      - name: Upload the container vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-vulnerability-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            grype-ci-report.json
            grype-ci-summary.json
            trivy-ci-report.json
            trivy-ci-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Check administrative release evidence when present
        run: |
          if [[ -f scripts/check_release_evidence.py ]]; then
            python scripts/check_release_evidence.py
          elif [[ -f PACKAGE_CONTENTS.json && -f PACKAGE_SHA256SUMS.txt ]]; then
            package_dir="$(mktemp -d)"
            git archive --format=tar HEAD | tar -xf - -C "$package_dir"
            (cd "$package_dir" && python scripts/verify_manifest.py)
            rm -rf "$package_dir"
          else
            echo "Release evidence checker or verified public-package markers are required." >&2
            exit 1
          fi
      - run: >-
          python scripts/build_public_release.py
          --output /tmp/remedialhq-public-release.zip
