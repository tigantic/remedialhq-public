name: Isolated handoff site deployment
on:
  push:
    branches: [ops/handoff-deploy-20260905]
    paths: [.github/workflows/handoff-isolated-deploy.yml]
permissions:
  contents: write
concurrency:
  group: handoff-isolated-deploy-20260905
  cancel-in-progress: false
jobs:
  deploy-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Receive encrypted deployment package and deploy only the existing handoff site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {generateKeyPairSync,privateDecrypt,createDecipheriv,createHash,constants} from 'node:crypto';
          import {writeFile,mkdir,rm} from 'node:fs/promises';
          import {spawn} from 'node:child_process';
          import {tmpdir} from 'node:os';
          import path from 'node:path';
          const branch='ops/handoff-deploy-20260905';
          const site='b093150a-17e9-4b2b-9abb-21d35f7102e0';
          const repo=process.env.GH_REPO;
          const run=process.env.GH_RUN;
          if(repo!=='tigantic/remedialhq-public') throw Error('Unexpected repository');
          const api='https://api.github.com/repos/'+repo+'/contents/';
          const headers={'Authorization':'Bearer '+process.env.GH_TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(name){
            const r=await fetch(api+name+'?ref='+encodeURIComponent(branch),{headers,signal:AbortSignal.timeout(20000)});
            if(r.status===404)return null;
            if(!r.ok)throw Error('Repository read failed: '+r.status);
            return await r.json();
          }
          async function put(name,value){
            const old=await read(name);
            const body={message:'Record isolated handoff deployment status [skip ci]',branch,content:Buffer.from(JSON.stringify(value,null,2)).toString('base64')};
            if(old)body.sha=old.sha;
            const r=await fetch(api+name,{method:'PUT',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('Repository status write failed: '+r.status);
          }
          const {publicKey,privateKey}=generateKeyPairSync('rsa',{modulusLength:3072,publicKeyEncoding:{type:'spki',format:'pem'},privateKeyEncoding:{type:'pkcs8',format:'pem'}});
          let secretValues=[];
          const redact=s=>secretValues.reduce((v,k)=>k?v.split(k).join('[REDACTED]'):v,String(s));
          const base={run_id:run,site_id:site,branch,public_key:publicKey,created_at:new Date().toISOString()};
          async function status(state,extra={}){await put('.handoff-transfer/receiver.json',{...base,state,...extra,updated_at:new Date().toISOString()});}
          const childEnv={PATH:process.env.PATH,HOME:process.env.HOME,TMPDIR:tmpdir(),CI:'true',NO_COLOR:'1',npm_config_audit:'false',npm_config_fund:'false'};
          async function execute(command,args,cwd,extraEnv={}){
            return await new Promise((resolve,reject)=>{
              let out='';
              const p=spawn(command,args,{cwd,env:{...childEnv,...extraEnv},stdio:['ignore','pipe','pipe']});
              for(const stream of [p.stdout,p.stderr])stream.on('data',d=>{out+=d.toString();if(out.length>180000)out=out.slice(-180000);});
              p.on('error',reject);
              p.on('close',code=>{const log=redact(out);console.log(log);code===0?resolve(log):reject(Error(command+' exited '+code+'\n'+log.slice(-18000)));});
            });
          }
          const work=path.join(tmpdir(),'handoff-deploy-'+run);
          try{
            await status('awaiting_encrypted_package');
            let pointer=null;
            const expires=Date.now()+18*60*1000;
            while(Date.now()<expires){
              const record=await read('.handoff-transfer/envelope.json');
              if(record){const p=JSON.parse(Buffer.from(record.content,'base64').toString());if(String(p.run_id)===run){pointer=p;break;}}
              await sleep(6000);
            }
            if(!pointer)throw Error('Encrypted transfer window expired; nothing deployed');
            let encrypted;
            if(pointer.capsule_base64){encrypted=Buffer.from(pointer.capsule_base64,'base64');}
            else{
              const url=new URL(pointer.capsule_url);
              if(url.protocol!=='https:'||!['drive.google.com','drive.usercontent.google.com','raw.githubusercontent.com'].includes(url.hostname))throw Error('Unapproved encrypted artifact host');
              const r=await fetch(url,{signal:AbortSignal.timeout(60000)});
              if(!r.ok)throw Error('Encrypted package fetch failed: '+r.status);
              encrypted=Buffer.from(await r.arrayBuffer());
            }
            if(encrypted.length>2000000)throw Error('Encrypted package exceeds transfer limit');
            if(createHash('sha256').update(encrypted).digest('hex')!==pointer.sha256)throw Error('Encrypted package hash mismatch');
            const box=JSON.parse(encrypted.toString());
            const key=privateDecrypt({key:privateKey,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},Buffer.from(box.key,'base64'));
            const dec=createDecipheriv('aes-256-gcm',key,Buffer.from(box.nonce,'base64'));
            dec.setAuthTag(Buffer.from(box.tag,'base64'));
            const payload=JSON.parse(Buffer.concat([dec.update(Buffer.from(box.data,'base64')),dec.final()]).toString());
            if(payload.site_id!==site||String(payload.run_id)!==run)throw Error('Deployment identity mismatch');
            const proxy=new URL(payload.proxy_url);
            if(proxy.protocol!=='https:'||proxy.hostname!=='netlify-mcp.netlify.app'||!proxy.pathname.startsWith('/proxy/'))throw Error('Unexpected deployment authorization URL');
            secretValues=[payload.proxy_url,payload.webhook_secret];
            for(const s of secretValues)if(s)console.log('::add-mask::'+s);
            await status('package_received');
            await mkdir(work,{recursive:true,mode:0o700});
            const zip=Buffer.from(payload.archive_base64,'base64');
            if(createHash('sha256').update(zip).digest('hex')!==payload.archive_sha256)throw Error('Deployment archive hash mismatch');
            await writeFile(path.join(work,'deploy.zip'),zip,{mode:0o600});
            await execute('python3',['-c','import pathlib,zipfile,sys; p=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(p/"deploy.zip"); assert all((p/f.filename).resolve().is_relative_to(p.resolve()) for f in z.infolist()); z.extractall(p)',work],work);
            const root=path.join(work,'ai-project-handoff-deploy');
            await execute('npm',['install','--ignore-scripts','--no-audit','--no-fund'],root);
            const tests=await execute('npm',['run','check'],root);
            await status('local_checks_passed_uploading',{checks:tests.slice(-14000)});
            const deploy=await execute('npx',['-y','@netlify/mcp@latest','--site-id',site,'--proxy-path',payload.proxy_url],root);
            await status('uploaded_verifying',{deploy_log:deploy.slice(-14000)});
            const verify=await execute('node',['operations/check-live.mjs'],root);
            await status('deployment_verified',{deploy_log:deploy.slice(-14000),verification:verify.slice(-14000),archive_sha256:payload.archive_sha256});
          }catch(e){
            const error=redact(e?.message??e);
            console.error(error);
            await status('failed',{error:error.slice(-18000)}).catch(()=>{});
            process.exitCode=1;
          }finally{await rm(work,{recursive:true,force:true});}
          NODE
